name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Exercise the declared floor (requires-python >= 3.12) and the
        # latest supported interpreter, not just whatever the runner has.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: uv run pytest -q

  smoke:
    name: Clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Clean-install smoke
        run: bash scripts/smoke-install.sh
